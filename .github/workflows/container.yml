name: Publish container image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - ".openai/hosting.json"
      - "app/**"
      - "Dockerfile"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "tsconfig.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build standalone server
        run: npm run build

      - name: Verify standalone output
        run: test -f dist/standalone/server.js

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable multi-platform execution
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        run: >-
          docker buildx build
          --platform "${{ matrix.platform }}"
          --load
          --tag "starsnap-website:smoke-${{ matrix.suffix }}"
          .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(docker run --detach --publish 3102:3000 "starsnap-website:smoke-${{ matrix.suffix }}")"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health="starting"
          for _ in $(seq 1 90); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$health" = "healthy" ] || [ "$health" = "unhealthy" ]; then
              break
            fi
            sleep 1
          done

          if [ "$health" != "healthy" ]; then
            docker logs "$container_id"
            exit 1
          fi

          curl --fail --silent --show-error --output /tmp/starsnap-index.html http://127.0.0.1:3102/
          grep --quiet StarSnap /tmp/starsnap-index.html
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3102/icon.png
          test "$(docker exec "$container_id" id -u)" = "1000"

  publish:
    needs:
      - quality
      - container-smoke
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable multi-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
