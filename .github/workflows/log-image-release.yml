name: Publish StarSnap Log images

on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: Full starsnap-log-web commit SHA to publish
        required: true
        type: string
      server_ref:
        description: Full starsnap-log-server commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: starsnap-log-image-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate immutable source refs
        env:
          WEB_REF: ${{ inputs.web_ref }}
          SERVER_REF: ${{ inputs.server_ref }}
        run: |
          set -euo pipefail
          [[ "$WEB_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out Log web source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: starsnap/starsnap-log-web
          ref: ${{ inputs.web_ref }}
          path: log-web
          token: ${{ secrets.PLATFORM_GHCR_TOKEN }}
          persist-credentials: false

      - name: Check out Log server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: starsnap/starsnap-log-server
          ref: ${{ inputs.server_ref }}
          path: log-server
          token: ${{ secrets.PLATFORM_GHCR_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: log-web/package-lock.json

      - name: Build exact Log web source
        working-directory: log-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            log-server/*.gradle.kts
            log-server/gradle/wrapper/gradle-wrapper.properties

      - name: Test exact Log server source
        working-directory: log-server
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Enable ARM64 execution
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PLATFORM_GHCR_TOKEN }}

      - name: Build and publish Log web image
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: log-web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/starsnap/starsnap-log-web:sha-${{ inputs.web_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/starsnap/starsnap-log-web
            org.opencontainers.image.revision=${{ inputs.web_ref }}
          cache-from: type=gha,scope=starsnap-log-web
          cache-to: type=gha,mode=max,scope=starsnap-log-web
          provenance: true
          sbom: true

      - name: Build and publish Log server image
        id: server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: log-server
          platforms: linux/arm64
          push: true
          tags: ghcr.io/starsnap/starsnap-log-server:sha-${{ inputs.server_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/starsnap/starsnap-log-server
            org.opencontainers.image.revision=${{ inputs.server_ref }}
          cache-from: type=gha,scope=starsnap-log-server
          cache-to: type=gha,mode=max,scope=starsnap-log-server
          provenance: true
          sbom: true

      - name: Report immutable images
        run: |
          echo "web=ghcr.io/starsnap/starsnap-log-web@${{ steps.web.outputs.digest }}"
          echo "server=ghcr.io/starsnap/starsnap-log-server@${{ steps.server.outputs.digest }}"
