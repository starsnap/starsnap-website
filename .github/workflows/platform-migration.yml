name: Stage and migrate StarSnap platform

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Migration phase to run on the 192.168.1.103 Swarm manager
        required: true
        type: choice
        options:
          - provision
          - diagnose-eat
          - diagnose-eat-parser
          - diagnose-eat-container
          - deploy-erp
          - deploy-hub
          - preflight
          - stage
          - restore
          - activate
          - cleanup-transfer
          - inspect-log
          - switch-log
          - switch-ollama
          - verify
          - verify-ollama
          - stop-target
      confirmation:
        description: Required phrase for deploy-erp, deploy-hub, activate, cleanup-transfer, switch-log, switch-ollama, or stop-target; leave empty for other phases
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: starsnap-platform-production
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.repository == 'starsnap/starsnap-website' &&
      github.ref == 'refs/heads/main' &&
      inputs.phase != 'diagnose-eat' &&
      inputs.phase != 'diagnose-eat-parser' &&
      inputs.phase != 'diagnose-eat-container'
    runs-on:
      group: starsnap-production
    environment: production
    timeout-minutes: 45

    env:
      DOCKER_CONFIG: /tmp/starsnap-platform-docker-${{ github.run_id }}-${{ github.run_attempt }}
      SNS_WEB_IMAGE: ${{ vars.PLATFORM_SNS_WEB_IMAGE }}
      ADMIN_WEB_IMAGE: ${{ vars.PLATFORM_ADMIN_WEB_IMAGE }}
      ADMIN_SERVER_IMAGE: ${{ vars.PLATFORM_ADMIN_SERVER_IMAGE }}
      HUB_WEB_IMAGE: ${{ vars.PLATFORM_HUB_WEB_IMAGE }}
      HUB_SERVER_IMAGE: ${{ vars.PLATFORM_HUB_SERVER_IMAGE }}
      ERP_WEB_IMAGE: ${{ vars.PLATFORM_ERP_WEB_IMAGE }}
      ERP_SMTP_MAILER_IMAGE: ${{ vars.PLATFORM_ERP_SMTP_MAILER_IMAGE }}
      ERP_EMBEDDING_WORKER_IMAGE: ${{ vars.PLATFORM_ERP_EMBEDDING_WORKER_IMAGE }}
      MAIN_DB_PASSWORD_SECRET_NAME: starsnap-platform-main-db-password-v1
      ERP_DB_PASSWORD_SECRET_NAME: starsnap-platform-erp-db-password-v1
      ADMIN_JWT_SECRET_NAME: starsnap-platform-admin-jwt-v1
      AWS_ACCESS_KEY_ID_SECRET_NAME: starsnap-platform-aws-access-key-id-v1
      AWS_SECRET_ACCESS_KEY_SECRET_NAME: starsnap-platform-aws-secret-access-key-v1
      HUB_INGEST_SECRET_NAME: starsnap-platform-hub-ingest-v1
      HUB_DB_PASSWORD_SECRET_NAME: starsnap-platform-hub-db-password-v1
      CLOUDFLARE_ACCESS_TEAM_DOMAIN_SECRET_NAME: starsnap-platform-cf-team-domain-v1
      CLOUDFLARE_ACCESS_AUDIENCE_SECRET_NAME: starsnap-platform-cf-audience-v1
      ERP_AUTH_CODE_SECRET_NAME: starsnap-platform-erp-auth-code-v1
      ERP_SMTP_MAILER_TOKEN_SECRET_NAME: starsnap-platform-erp-mailer-token-v1
      ERP_SMTP_USERNAME_SECRET_NAME: starsnap-platform-erp-smtp-username-v1
      ERP_SMTP_PASSWORD_SECRET_NAME: starsnap-platform-erp-smtp-password-v1
      ERP_EMBEDDING_WORKER_TOKEN_SECRET_NAME: starsnap-platform-erp-embedding-token-v1
      ERP_EAT_API_SECRET_NAME: starsnap-platform-erp-eat-api-v2
      PLATFORM_TRANSFER_TOKEN_SECRET_NAME: starsnap-platform-transfer-token-20260827
      PLATFORM_TRANSFER_PASSPHRASE_SECRET_NAME: starsnap-platform-transfer-passphrase-20260827
      HUB_POSTGRES_VOLUME_NAME: starsnap-hub-postgres-data-v1
      ERP_POSTGRES_VOLUME_NAME: starsnap-erp-postgres-data-v1
      ERP_OLLAMA_VOLUME_NAME: starsnap-erp-ollama-models-v1
      ERP_POSTGRES_INIT_CONFIG_NAME: starsnap-erp-postgres-init-v1
      ERP_EMBEDDING_BASE_URL: http://mac-mini.hamtory.com:11434
      ERP_OLLAMA_REPLICAS: "0"
      ERP_OLLAMA_MODEL_REPLICAS: "0"
      PLATFORM_DATA_SHA256: ${{ vars.PLATFORM_DATA_SHA256 }}

    steps:
      - name: Check out migration files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: Verify Swarm manager target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          test "$(docker info --format '{{.Swarm.ControlAvailable}}')" = "true"
          node_address="$(docker node inspect self --format '{{.Status.Addr}}')"
          if [ "$node_address" != "192.168.1.103" ]; then
            echo "Expected Swarm manager address 192.168.1.103, got $node_address" >&2
            exit 1
          fi

      - name: Sign in to GHCR for private platform images
        if: ${{ inputs.phase == 'stage' || inputs.phase == 'activate' || inputs.phase == 'deploy-erp' }}
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.PLATFORM_GHCR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null

      - name: Sign in to GHCR for Hub web release
        if: ${{ inputs.phase == 'deploy-hub' }}
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null

      - name: Provision versioned Swarm secrets
        if: ${{ inputs.phase == 'provision' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.PLATFORM_AWS_ACCESS_KEY_ID_VALUE }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.PLATFORM_AWS_SECRET_ACCESS_KEY_VALUE }}
          HUB_INGEST_VALUE: ${{ secrets.PLATFORM_HUB_INGEST_VALUE }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN_VALUE: ${{ secrets.PLATFORM_CLOUDFLARE_TEAM_DOMAIN_VALUE }}
          CLOUDFLARE_ACCESS_AUDIENCE_VALUE: ${{ secrets.PLATFORM_CLOUDFLARE_AUDIENCE_VALUE }}
          ERP_SMTP_USERNAME_VALUE: ${{ secrets.PLATFORM_ERP_SMTP_USERNAME_VALUE }}
          ERP_SMTP_PASSWORD_VALUE: ${{ secrets.PLATFORM_ERP_SMTP_PASSWORD_VALUE }}
          ERP_EAT_API_VALUE: ${{ secrets.PLATFORM_ERP_EAT_API_VALUE }}
          PLATFORM_TRANSFER_TOKEN_VALUE: ${{ secrets.PLATFORM_TRANSFER_TOKEN_VALUE }}
          PLATFORM_TRANSFER_PASSPHRASE_VALUE: ${{ secrets.PLATFORM_TRANSFER_PASSPHRASE_VALUE }}
        run: bash deploy/platform/provision-secrets.sh

      - name: Run target platform phase
        if: >-
          inputs.phase == 'preflight' ||
          inputs.phase == 'stage' ||
          inputs.phase == 'activate' ||
          inputs.phase == 'verify'
        shell: bash
        env:
          ALLOW_PLATFORM_ACTIVATION: ${{ inputs.confirmation }}
          ALLOW_PLATFORM_STOP: ${{ inputs.confirmation }}
          ERP_EMBEDDING_BASE_URL: http://ollama:11434
          ERP_OLLAMA_REPLICAS: "1"
          ERP_OLLAMA_MODEL_REPLICAS: "1"
        run: bash deploy/platform/deploy-platform.sh "${{ inputs.phase }}"

      - name: Back up, deploy, and verify ERP web only
        if: ${{ inputs.phase == 'deploy-erp' }}
        shell: bash
        env:
          ALLOW_ERP_DEPLOY: ${{ inputs.confirmation }}
        run: bash deploy/platform/deploy-erp.sh

      - name: Deploy and verify Hub web only
        if: ${{ inputs.phase == 'deploy-hub' }}
        shell: bash
        env:
          ALLOW_HUB_DEPLOY: ${{ inputs.confirmation }}
        run: bash deploy/platform/deploy-hub.sh

      - name: Verify live Ollama semantic path
        if: ${{ inputs.phase == 'verify-ollama' }}
        shell: bash
        run: bash deploy/platform/verify-ollama.sh

      - name: Switch ERP embedding to native macOS Ollama
        if: ${{ inputs.phase == 'switch-ollama' }}
        shell: bash
        env:
          ALLOW_OLLAMA_ROUTE: ${{ inputs.confirmation }}
        run: bash deploy/platform/switch-ollama.sh switch

      - name: Switch SNS API logging to target Hub
        if: ${{ inputs.phase == 'switch-log' }}
        shell: bash
        env:
          ALLOW_API_LOG_ROUTE: ${{ inputs.confirmation }}
        run: bash deploy/platform/switch-main-api-log.sh switch

      - name: Inspect SNS API logging rollout state
        if: ${{ inputs.phase == 'inspect-log' }}
        shell: bash
        run: |
          set -euo pipefail
          api_service=starsnap-main_api
          marker_name=starsnap-main-api-log-route-pre-20260827
          docker service inspect \
            --format 'Version={{.Version.Index}} UpdateStatus={{json .UpdateStatus}} UpdateConfig={{json .Spec.UpdateConfig}} RollbackConfig={{json .Spec.RollbackConfig}}' \
            "$api_service"
          docker service ls \
            --filter "name=$api_service" \
            --format 'Service={{.Name}} Replicas={{.Replicas}}'
          docker service ps --no-trunc "$api_service"
          api_container="$(docker ps \
            --filter "label=com.docker.swarm.service.name=$api_service" \
            --filter status=running \
            --format '{{.ID}}' \
            | awk 'NF {id=$0; count++} END {if (count == 1) print id; else exit 1}')"
          docker inspect \
            --format 'ContainerStatus={{.State.Status}} Running={{.State.Running}} StartedAt={{.State.StartedAt}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
            "$api_container"
          docker inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "$api_container" \
            | awk -F= '$1 == "SERVER_LOG_BASE_URL" {print "LogRoute=" $0; count++} END {if (count == 0) print "LogRouteAbsent=true"; if (count > 1) exit 2}'
          probe_containers="$(docker ps \
            --filter 'label=com.docker.swarm.service.name=starsnap-erp_web' \
            --filter status=running \
            --format '{{.ID}}')"
          printf 'ProbeContainers=%s\n' "$(awk 'NF {count++} END {print count + 0}' <<<"$probe_containers")"
          while IFS= read -r probe_container; do
            test -n "$probe_container" || continue
            docker inspect \
              --format 'ProbeContainer={{.Id}} Status={{.State.Status}} Running={{.State.Running}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              "$probe_container"
            docker exec "$probe_container" node -e '
              const http = require("node:http");
              const request = http.get({
                hostname: "starsnap-main_api",
                port: 8080,
                path: "/api/health",
                headers: { Host: "api.starsnap.kr" },
              }, (response) => {
                let body = "";
                response.setEncoding("utf8");
                response.on("data", (chunk) => { body += chunk; });
                response.on("end", () => {
                  console.log(`ApiProbeStatus=${response.statusCode} ApiProbeBody=${body}`);
                  process.exit(response.statusCode >= 200 && response.statusCode < 300 ? 0 : 1);
                });
              });
              request.setTimeout(5000, () => request.destroy(new Error("timeout")));
              request.on("error", (error) => {
                console.error(`ApiProbeError=${error.message}`);
                process.exit(1);
              });
            '
          done <<<"$probe_containers"
          if docker config inspect "$marker_name" >/dev/null 2>&1; then
            docker config inspect \
              --format 'RollbackMarkerPresent=true PreviousPresent={{index .Spec.Labels "com.starsnap.previous-present"}} PreviousURL={{index .Spec.Labels "com.starsnap.previous-url"}}' \
              "$marker_name"
          else
            echo 'RollbackMarkerPresent=false'
          fi

      - name: Restore SNS API logging before stopping target
        if: ${{ inputs.phase == 'stop-target' }}
        shell: bash
        env:
          ALLOW_API_LOG_ROUTE: ${{ inputs.confirmation }}
        run: bash deploy/platform/switch-main-api-log.sh restore

      - name: Stop target services and preserve data
        if: ${{ inputs.phase == 'stop-target' }}
        shell: bash
        env:
          ALLOW_PLATFORM_STOP: ${{ inputs.confirmation }}
        run: bash deploy/platform/deploy-platform.sh stop-target

      - name: Restore encrypted desktop snapshot
        if: ${{ inputs.phase == 'restore' }}
        shell: bash
        run: bash deploy/platform/restore-platform-data.sh

      - name: Remove server-side transfer copy and transfer secrets
        if: ${{ inputs.phase == 'cleanup-transfer' }}
        shell: bash
        env:
          ALLOW_TRANSFER_CLEANUP: ${{ inputs.confirmation }}
        run: bash deploy/platform/cleanup-server-transfer.sh

      - name: Remove temporary Docker client state
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          expected="/tmp/starsnap-platform-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$DOCKER_CONFIG" = "$expected"
          docker logout ghcr.io >/dev/null 2>&1 || true
          if [ -d "$DOCKER_CONFIG" ]; then
            find "$DOCKER_CONFIG" -depth -delete
          fi

  diagnose_eat:
    if: >-
      github.repository == 'starsnap/starsnap-website' &&
      github.ref == 'refs/heads/main' &&
      inputs.phase == 'diagnose-eat'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Check out the credential-safe diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/platform/eat-workerd-diagnostic-worker.mjs
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the pinned workerd diagnostic runtime
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare the isolated diagnostic directory
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="$RUNNER_TEMP/eat-workerd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$diagnostic_dir" in
            "$RUNNER_TEMP"/eat-workerd-*) ;;
            *) exit 1 ;;
          esac
          mkdir -p "$diagnostic_dir"
          chmod 700 "$diagnostic_dir"
          cp deploy/platform/eat-workerd-diagnostic-worker.mjs "$diagnostic_dir/worker.mjs"
          printf 'DIAGNOSTIC_DIR=%s\n' "$diagnostic_dir" >>"$GITHUB_ENV"

      - name: Exercise the exact eAT response path in workerd
        shell: bash
        env:
          EAT_API_SERVICE_KEY: ${{ secrets.PLATFORM_ERP_EAT_API_VALUE }}
        run: |
          set -euo pipefail
          diagnostic_dir="${DIAGNOSTIC_DIR:-}"
          case "$diagnostic_dir" in
            "$RUNNER_TEMP"/eat-workerd-*) ;;
            *) exit 1 ;;
          esac
          worker_pid=''
          cleanup() {
            if [ -n "$worker_pid" ]; then
              kill "$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            if [ -d "$diagnostic_dir" ]; then
              find "$diagnostic_dir" -depth -delete
            fi
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          test -n "$EAT_API_SERVICE_KEY"
          response_file="$diagnostic_dir/response.json"
          log_file="$diagnostic_dir/wrangler.log"
          umask 077
          printf 'EAT_API_SERVICE_KEY=%s\n' "$EAT_API_SERVICE_KEY" >"$diagnostic_dir/.dev.vars"
          unset EAT_API_SERVICE_KEY
          cd "$diagnostic_dir"

          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" dev worker.mjs \
            --local \
            --ip 127.0.0.1 \
            --port 8787 \
            --compatibility-date 2026-05-22 \
            --compatibility-flag nodejs_compat \
            --log-level error \
            --show-interactive-dev-session=false \
            >"$log_file" 2>&1 &
          worker_pid=$!

          http_code=''
          for _ in $(seq 1 30); do
            http_code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              http://127.0.0.1:8787/ || true)"
            if [ "$http_code" != '000' ]; then
              break
            fi
            sleep 1
          done
          if [ "$http_code" = '000' ] || [ ! -s "$response_file" ]; then
            sed -E 's/[A-Za-z0-9%+\/=]{32,}/[redacted]/g' "$log_file" >&2
            exit 1
          fi
          cat "$response_file"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const successCodes = new Set(["0", "00", "0000"]);
            const integer = (value) => Number.isInteger(value) ? value : NaN;
            const total = integer(result.totalCount);
            const pageCount = integer(result.pageNo);
            const pageSize = integer(result.numOfRows);
            const itemCount = integer(result.itemCount);
            const expectedPageCount = Math.max(Math.ceil(total / 20), 1);
            const expectedItemCount = Math.min(20, total);
            if (
              !result.ok ||
              result.stage !== "complete" ||
              !successCodes.has(result.resultCode) ||
              result.requestedPage !== 1 ||
              result.requestedPageSize !== 20 ||
              total < 1 ||
              pageSize !== 20 ||
              pageCount !== expectedPageCount ||
              itemCount !== expectedItemCount
            ) process.exit(1);
          ' "$response_file"

      - name: Remove diagnostic artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="${DIAGNOSTIC_DIR:-}"
          case "$diagnostic_dir" in
            "$RUNNER_TEMP"/eat-workerd-*) ;;
            '') exit 0 ;;
            *) exit 1 ;;
          esac
          if [ -d "$diagnostic_dir" ]; then
            find "$diagnostic_dir" -depth -delete
          fi

  diagnose_eat_parser:
    if: >-
      github.repository == 'starsnap/starsnap-website' &&
      github.ref == 'refs/heads/main' &&
      inputs.phase == 'diagnose-eat-parser'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Check out the trusted parser diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/platform/eat-parser-workerd-diagnostic-worker.ts
            deploy/platform/eat-parser-workerd-diagnostic-wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Check out the exact ERP parser release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6ddc94bbfe66c9aa34bb411fb043d0747f1d9169
          path: release-source
          sparse-checkout: |
            .release/erp-web/package.json
            .release/erp-web/package-lock.json
            .release/erp-web/db/eat-api-parser.ts
            .release/erp-web/app/lib/eat-bid-types.ts
          sparse-checkout-cone-mode: false

      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: release-source/.release/erp-web/package-lock.json

      - name: Install the exact parser release dependencies
        working-directory: release-source/.release/erp-web
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare the isolated parser diagnostic
        shell: bash
        run: |
          set -euo pipefail
          parser_root="$GITHUB_WORKSPACE/release-source/.release/erp-web"
          test -f "$parser_root/db/eat-api-parser.ts"
          cp deploy/platform/eat-parser-workerd-diagnostic-worker.ts \
            "$parser_root/eat-parser-workerd-diagnostic-worker.ts"
          cp deploy/platform/eat-parser-workerd-diagnostic-wrangler.jsonc \
            "$parser_root/eat-parser-workerd-diagnostic-wrangler.jsonc"
          printf 'PARSER_DIAGNOSTIC_ROOT=%s\n' "$parser_root" >>"$GITHUB_ENV"

      - name: Exercise the exact production parser in workerd
        shell: bash
        env:
          EAT_API_SERVICE_KEY: ${{ secrets.PLATFORM_ERP_EAT_API_VALUE }}
        run: |
          set -euo pipefail
          parser_root="${PARSER_DIAGNOSTIC_ROOT:-}"
          if [ "$parser_root" != "$GITHUB_WORKSPACE/release-source/.release/erp-web" ]; then
            exit 1
          fi
          worker_pid=''
          cleanup() {
            if [ -n "$worker_pid" ]; then
              kill "$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            for artifact in \
              "$parser_root/.dev.vars" \
              "$parser_root/diagnostic-response.json" \
              "$parser_root/diagnostic-wrangler.log"; do
              if [ -f "$artifact" ]; then
                rm -f -- "$artifact"
              fi
            done
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          test -n "$EAT_API_SERVICE_KEY"
          umask 077
          printf 'EAT_API_SERVICE_KEY=%s\n' "$EAT_API_SERVICE_KEY" >"$parser_root/.dev.vars"
          unset EAT_API_SERVICE_KEY
          cd "$parser_root"

          ./node_modules/.bin/wrangler dev \
            --config eat-parser-workerd-diagnostic-wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8787 \
            --log-level error \
            --show-interactive-dev-session=false \
            >diagnostic-wrangler.log 2>&1 &
          worker_pid=$!

          http_code=''
          for _ in $(seq 1 30); do
            http_code="$(curl --silent --show-error \
              --output diagnostic-response.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:8787/ || true)"
            if [ "$http_code" != '000' ]; then
              break
            fi
            sleep 1
          done
          if [ "$http_code" = '000' ] || [ ! -s diagnostic-response.json ]; then
            sed -E 's/[A-Za-z0-9%+\/=]{32,}/[redacted]/g' diagnostic-wrangler.log >&2
            exit 1
          fi
          cat diagnostic-response.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              !result.ok ||
              result.stage !== "complete" ||
              result.total < 1 ||
              result.page !== 1 ||
              result.pageSize !== 20 ||
              result.itemCount !== Math.min(20, result.total)
            ) process.exit(1);
          ' diagnostic-response.json

      - name: Remove parser diagnostic artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          parser_root="${PARSER_DIAGNOSTIC_ROOT:-}"
          if [ -z "$parser_root" ]; then
            exit 0
          fi
          if [ "$parser_root" != "$GITHUB_WORKSPACE/release-source/.release/erp-web" ]; then
            exit 1
          fi
          for artifact in \
            "$parser_root/.dev.vars" \
            "$parser_root/diagnostic-response.json" \
            "$parser_root/diagnostic-wrangler.log" \
            "$parser_root/eat-parser-workerd-diagnostic-worker.ts" \
            "$parser_root/eat-parser-workerd-diagnostic-wrangler.jsonc"; do
            if [ -f "$artifact" ]; then
              rm -f -- "$artifact"
            fi
          done

  diagnose_eat_container:
    if: >-
      github.repository == 'starsnap/starsnap-website' &&
      github.ref == 'refs/heads/main' &&
      inputs.phase == 'diagnose-eat-container'
    runs-on:
      group: starsnap-production
    environment: production
    timeout-minutes: 5

    steps:
      - name: Exercise eAT from the running ERP container network
        shell: bash
        env:
          EAT_API_SERVICE_KEY: ${{ secrets.PLATFORM_ERP_EAT_API_VALUE }}
        run: |
          set -euo pipefail
          test -n "$EAT_API_SERVICE_KEY"
          service_key="$EAT_API_SERVICE_KEY"
          unset EAT_API_SERVICE_KEY

          mapfile -t container_ids < <(
            docker ps \
              --filter label=com.docker.swarm.service.name=starsnap-erp_web \
              --format '{{.ID}}'
          )
          if [ "${#container_ids[@]}" -ne 1 ]; then
            printf 'Expected one running ERP task container; found %s.\n' "${#container_ids[@]}" >&2
            exit 1
          fi

          printf '%s' "$service_key" | docker exec -i "${container_ids[0]}" node -e '
            const fs = require("node:fs");
            const endpoint = "https://apis.data.go.kr/B552845/eaTPubServiceN3/eaTBidListN3";
            const maximumResponseBytes = 2 * 1024 * 1024;
            const successCodes = new Set(["0", "00", "0000"]);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20_000);
            let stage = "key";
            (async () => {
              try {
                const key = decodeURIComponent(fs.readFileSync(0, "utf8").trim());
                const url = new URL(endpoint);
                url.searchParams.set("serviceKey", key);
                url.searchParams.set("pageNo", "1");
                url.searchParams.set("numOfRows", "20");
                url.searchParams.set("ancmStsrDt", "20260729");
                url.searchParams.set("ancmEndDt", "20260827");
                url.searchParams.set("useOrganNm", "\uad50\uc721\uccad");

                stage = "fetch";
                const response = await fetch(url, {
                  headers: { Accept: "application/xml, text/xml;q=0.9" },
                  redirect: "manual",
                  referrerPolicy: "no-referrer",
                  signal: controller.signal,
                });
                if (!response.ok) {
                  await response.body?.cancel();
                  console.log(JSON.stringify({ ok: false, stage: "http", status: response.status }));
                  process.exitCode = 1;
                  return;
                }

                stage = "body";
                if (!response.body) throw new Error("Response body is missing.");
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                const chunks = [];
                let bytes = 0;
                try {
                  while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    bytes += value.byteLength;
                    if (bytes > maximumResponseBytes) {
                      await reader.cancel();
                      throw new Error("Response exceeded diagnostic limit.");
                    }
                    chunks.push(decoder.decode(value, { stream: true }));
                  }
                  chunks.push(decoder.decode());
                } finally {
                  reader.releaseLock();
                }

                stage = "inspect";
                const xml = chunks.join("");
                const valueOf = (tag) => xml.match(new RegExp("<" + tag + ">([^<]*)</" + tag + ">"))?.[1] ?? null;
                const integerValueOf = (tag) => {
                  const value = valueOf(tag);
                  return value !== null && /^\d+$/.test(value) ? Number(value) : null;
                };
                const resultCode = valueOf("resultCode");
                const totalCount = integerValueOf("totalCount");
                const pageNo = integerValueOf("pageNo");
                const numOfRows = integerValueOf("numOfRows");
                const itemCount = (xml.match(/<item(?:\s[^>]*)?>/g) ?? []).length;
                const validBody =
                  successCodes.has(resultCode) &&
                  totalCount !== null &&
                  totalCount > 0 &&
                  pageNo === Math.max(Math.ceil(totalCount / 20), 1) &&
                  numOfRows === 20 &&
                  itemCount === Math.min(20, totalCount);
                console.log(JSON.stringify({
                  ok: validBody,
                  stage: validBody ? "complete" : "inspect",
                  status: response.status,
                  bytes,
                  contentType: response.headers.get("content-type"),
                  resultCode,
                  totalCount,
                  pageNo,
                  numOfRows,
                  itemCount,
                }));
                if (!validBody) process.exitCode = 1;
              } catch (error) {
                const causeCode = typeof error?.cause?.code === "string" && /^[A-Z0-9_]+$/.test(error.cause.code)
                  ? error.cause.code
                  : null;
                console.log(JSON.stringify({
                  ok: false,
                  stage,
                  aborted: controller.signal.aborted,
                  errorName: error instanceof Error ? error.name : "UnknownError",
                  causeCode,
                }));
                process.exitCode = 1;
              } finally {
                clearTimeout(timeout);
              }
            })();
          '

          if docker exec "${container_ids[0]}" test -r /etc/ssl/certs/ca-certificates.crt; then
            echo '{"runtime":"container","caBundleReadable":true}'
          else
            echo '{"runtime":"container","caBundleReadable":false}'
          fi

          printf '%s' "$service_key" | docker exec -i "${container_ids[0]}" node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const key = readFileSync(0, "utf8").trim();
            const workerSource = String.raw`
              const endpoint = "https://apis.data.go.kr/B552845/eaTPubServiceN3/eaTBidListN3";
              const maximumResponseBytes = 2 * 1024 * 1024;
              const successCodes = new Set(["0", "00", "0000"]);

              export default {
                async fetch(_request, env) {
                  const controller = new AbortController();
                  const timeout = setTimeout(() => controller.abort(), 20_000);
                  let stage = "key";
                  try {
                    const decodedKey = decodeURIComponent(env.EAT_API_SERVICE_KEY.trim());
                    const url = new URL(endpoint);
                    url.searchParams.set("serviceKey", decodedKey);
                    url.searchParams.set("pageNo", "1");
                    url.searchParams.set("numOfRows", "20");
                    url.searchParams.set("ancmStsrDt", "20260729");
                    url.searchParams.set("ancmEndDt", "20260827");
                    url.searchParams.set("useOrganNm", "\uad50\uc721\uccad");

                    stage = "fetch";
                    const response = await fetch(url, {
                      headers: { Accept: "application/xml, text/xml;q=0.9" },
                      redirect: "manual",
                      referrerPolicy: "no-referrer",
                      signal: controller.signal,
                    });
                    if (!response.ok) {
                      await response.body?.cancel();
                      return Response.json({ ok: false, stage: "http", status: response.status }, { status: 502 });
                    }

                    stage = "body";
                    if (!response.body) throw new Error("Response body is missing.");
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    const chunks = [];
                    let bytes = 0;
                    try {
                      while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        bytes += value.byteLength;
                        if (bytes > maximumResponseBytes) {
                          await reader.cancel();
                          throw new Error("Response exceeded diagnostic limit.");
                        }
                        chunks.push(decoder.decode(value, { stream: true }));
                      }
                      chunks.push(decoder.decode());
                    } finally {
                      reader.releaseLock();
                    }

                    stage = "inspect";
                    const xml = chunks.join("");
                    const valueOf = (tag) => xml.match(new RegExp("<" + tag + ">([^<]*)</" + tag + ">"))?.[1] ?? null;
                    const integerValueOf = (tag) => {
                      const value = valueOf(tag);
                      return value !== null && /^\d+$/.test(value) ? Number(value) : null;
                    };
                    const resultCode = valueOf("resultCode");
                    const totalCount = integerValueOf("totalCount");
                    const pageNo = integerValueOf("pageNo");
                    const numOfRows = integerValueOf("numOfRows");
                    const itemCount = (xml.match(/<item(?:\s[^>]*)?>/g) ?? []).length;
                    const validBody =
                      successCodes.has(resultCode) &&
                      totalCount !== null &&
                      totalCount > 0 &&
                      pageNo === Math.max(Math.ceil(totalCount / 20), 1) &&
                      numOfRows === 20 &&
                      itemCount === Math.min(20, totalCount);
                    return Response.json({
                      ok: validBody,
                      stage: validBody ? "complete" : "inspect",
                      status: response.status,
                      bytes,
                      resultCode,
                      totalCount,
                      pageNo,
                      numOfRows,
                      itemCount,
                    }, { status: validBody ? 200 : 502 });
                  } catch (error) {
                    return Response.json({
                      ok: false,
                      stage,
                      aborted: controller.signal.aborted,
                      errorName: error instanceof Error ? error.name : "UnknownError",
                    }, { status: 500 });
                  } finally {
                    clearTimeout(timeout);
                  }
                },
              };
            `;

            let miniflare;
            try {
              const { Miniflare } = await import(
                "file:///usr/local/lib/node_modules/wrangler/node_modules/miniflare/dist/src/index.js"
              );
              miniflare = new Miniflare({
                bindings: { EAT_API_SERVICE_KEY: key },
                compatibilityDate: "2026-05-22",
                compatibilityFlags: ["nodejs_compat"],
                modules: true,
                script: workerSource,
              });
              const response = await miniflare.dispatchFetch("http://diagnostic.local/");
              const result = await response.json();
              console.log(JSON.stringify({ runtime: "workerd", ...result }));
              if (!response.ok || !result.ok || result.stage !== "complete") process.exitCode = 1;
            } catch (error) {
              const causeCode = typeof error?.cause?.code === "string" && /^[A-Z0-9_]+$/.test(error.cause.code)
                ? error.cause.code
                : null;
              console.log(JSON.stringify({
                runtime: "workerd",
                ok: false,
                stage: "runtime",
                errorName: error instanceof Error ? error.name : "UnknownError",
                causeCode,
              }));
              process.exitCode = 1;
            } finally {
              await miniflare?.dispose();
            }
          '
