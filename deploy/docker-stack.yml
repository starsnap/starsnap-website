version: "3.8"

services:
  website:
    image: ${STARSNAP_WEBSITE_IMAGE:?STARSNAP_WEBSITE_IMAGE must be an immutable digest reference}

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      HOSTNAME: "0.0.0.0"

    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

    stop_grace_period: 20s

    deploy:
      replicas: 1

      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 90s
        max_failure_ratio: 0

      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 90s

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      resources:
        reservations:
          cpus: "0.10"
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 512M
