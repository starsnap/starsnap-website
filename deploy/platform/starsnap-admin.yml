services:
  server:
    image: ${ADMIN_SERVER_IMAGE:?ADMIN_SERVER_IMAGE must be an immutable digest reference}
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        export POSTGRES_PASSWORD="$$(< /run/secrets/main-db-password)"
        export ERP_DATABASE_PASSWORD="$$(< /run/secrets/erp-db-password)"
        export JWT_SECRET="$$(< /run/secrets/admin-jwt-secret)"
        export AWS_ACCESS_KEY_ID="$$(< /run/secrets/aws-access-key-id)"
        export AWS_SECRET_ACCESS_KEY="$$(< /run/secrets/aws-secret-access-key)"
        export HUB_SERVER_LOG_SECRET="$$(< /run/secrets/hub-ingest-secret)"
        exec java -jar /app/starsnap-admin.jar
    environment:
      AUTH_COOKIE_SECURE: "true"
      ERP_DATABASE_URL: jdbc:postgresql://starsnap-erp_postgres:5432/mealops
      ERP_DATABASE_USERNAME: mealops
      SERVER_LOG_BASE_URL: http://starsnap-hub_server:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://starsnap-main_starsnap-postgres:5432/starsnap
      SPRING_DATASOURCE_USERNAME: starsnap
      WEB_ORIGIN: https://admin.starsnap.kr
    secrets:
      - source: main_db_password
        target: main-db-password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: erp_db_password
        target: erp-db-password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: admin_jwt_secret
        target: admin-jwt-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: aws_access_key_id
        target: aws-access-key-id
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: aws_secret_access_key
        target: aws-secret-access-key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: hub_ingest_secret
        target: hub-ingest-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - app_net
      - erp_database
    healthcheck:
      test:
        - CMD-SHELL
        - bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8082'
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 8
    stop_grace_period: 30s
    deploy:
      replicas: ${ADMIN_SERVER_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 240s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 240s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 180s
      resources:
        reservations:
          cpus: "0.10"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 1G

  web:
    image: ${ADMIN_WEB_IMAGE:?ADMIN_WEB_IMAGE must be an immutable digest reference}
    networks:
      - app_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    stop_grace_period: 20s
    deploy:
      replicas: ${ADMIN_WEB_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  app_net:
    external: true
    name: starsnap-main_app-net
  erp_database:
    external: true
    name: starsnap-erp_database

secrets:
  main_db_password:
    external: true
    name: ${MAIN_DB_PASSWORD_SECRET_NAME:?MAIN_DB_PASSWORD_SECRET_NAME is required}
  erp_db_password:
    external: true
    name: ${ERP_DB_PASSWORD_SECRET_NAME:?ERP_DB_PASSWORD_SECRET_NAME is required}
  admin_jwt_secret:
    external: true
    name: ${ADMIN_JWT_SECRET_NAME:?ADMIN_JWT_SECRET_NAME is required}
  aws_access_key_id:
    external: true
    name: ${AWS_ACCESS_KEY_ID_SECRET_NAME:?AWS_ACCESS_KEY_ID_SECRET_NAME is required}
  aws_secret_access_key:
    external: true
    name: ${AWS_SECRET_ACCESS_KEY_SECRET_NAME:?AWS_SECRET_ACCESS_KEY_SECRET_NAME is required}
  hub_ingest_secret:
    external: true
    name: ${HUB_INGEST_SECRET_NAME:?HUB_INGEST_SECRET_NAME is required}
