services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: mealops
      POSTGRES_PASSWORD_FILE: /run/secrets/erp-db-password
      POSTGRES_USER: mealops
    secrets:
      - source: erp_db_password
        target: erp-db-password
        uid: "999"
        gid: "999"
        mode: 0400
    configs:
      - source: erp_postgres_init
        target: /docker-entrypoint-initdb.d/001-enable-vector.sql
        mode: 0444
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U mealops -d mealops &&
          test "$$(psql -U mealops -d mealops -tAc "SELECT extversion FROM pg_extension WHERE extname = 'vector'")" = "0.8.6"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    stop_grace_period: 90s
    deploy:
      replicas: ${ERP_POSTGRES_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 120s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 120s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 300s
      resources:
        reservations:
          cpus: "0.20"
          memory: 256M
        limits:
          cpus: "2.00"
          memory: 2G

  ollama:
    image: docker.io/ollama/ollama:0.32.15@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - erp_ollama_models:/root/.ollama
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    stop_grace_period: 60s
    deploy:
      replicas: ${ERP_OLLAMA_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 120s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 120s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
      resources:
        reservations:
          cpus: "0.50"
          memory: 1G
        limits:
          cpus: "4.00"
          memory: 4G

  ollama-model:
    image: docker.io/ollama/ollama:0.32.15@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 3; done
        ollama pull bge-m3:567m-fp16
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - default
    deploy:
      replicas: ${ERP_OLLAMA_MODEL_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 600s
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.50"
          memory: 256M

  smtp-mailer:
    image: ${ERP_SMTP_MAILER_IMAGE:?ERP_SMTP_MAILER_IMAGE must be an immutable digest reference}
    environment:
      AUTH_SMTP_MAILER_TOKEN_FILE: /run/secrets/smtp-mailer-token
      HOST: 0.0.0.0
      PORT: "3000"
      SMTP_HOST: smtp.gmail.com
      SMTP_PASSWORD_FILE: /run/secrets/smtp-password
      SMTP_PORT: "587"
      SMTP_REQUIRE_TLS: "true"
      SMTP_SECURE: "false"
      SMTP_USERNAME_FILE: /run/secrets/smtp-username
    secrets:
      - source: smtp_mailer_token
        target: smtp-mailer-token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_username
        target: smtp-username
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_password
        target: smtp-password
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 8
    stop_grace_period: 30s
    deploy:
      replicas: ${ERP_SMTP_MAILER_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 90s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 8
        window: 180s

  web:
    image: ${ERP_WEB_IMAGE:?ERP_WEB_IMAGE must be an immutable digest reference}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        export DATABASE_URL="postgresql://mealops:$$(cat /run/secrets/erp-db-password)@postgres:5432/mealops"
        export HUB_SERVER_LOG_SECRET="$$(cat /run/secrets/hub-ingest-secret)"
        exec starsnap-erp-entrypoint
    environment:
      AUTH_CODE_SECRET_FILE: /run/secrets/auth-code-secret
      AUTH_EMAIL_FROM: StarSnap ERP <no-reply@starsnap.kr>
      AUTH_EMAIL_TRANSPORT: smtp-mailer
      AUTH_SMTP_MAILER_TOKEN_FILE: /run/secrets/smtp-mailer-token
      AUTH_SMTP_MAILER_URL: http://smtp-mailer:3000
      AUTH_TRUST_PROXY_HEADERS: "true"
      ERP_ALLOWED_ORIGINS: https://erp.starsnap.kr
      ERP_EMBEDDING_BASE_URL: ${ERP_EMBEDDING_BASE_URL:-http://ollama:11434}
      ERP_EMBEDDING_BATCH_SIZE: "128"
      ERP_EMBEDDING_KEEP_ALIVE: 30m
      ERP_EMBEDDING_TIMEOUT_MS: "120000"
      ERP_EMBEDDING_WORKER_TOKEN_FILE: /run/secrets/embedding-worker-token
      EAT_API_SERVICE_KEY_FILE: /run/secrets/eat-api-service-key
      EAT_CACHE_TTL_MINUTES: "360"
      HUB_SERVER_LOG_TIMEOUT_MS: "750"
      HUB_SERVER_LOG_URL: http://starsnap-hub_server:8081/api/server-logs
      PGPOOL_MAX: "1"
      PGSSL: disable
      SITE_ORIGIN: https://erp.starsnap.kr
    secrets:
      - source: erp_db_password
        target: erp-db-password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: auth_code_secret
        target: auth-code-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_mailer_token
        target: smtp-mailer-token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: embedding_worker_token
        target: embedding-worker-token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: hub_ingest_secret
        target: hub-ingest-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: eat_api_service_key
        target: eat-api-service-key
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - app_net
      - database
      - default
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      start_period: 90s
      retries: 8
    stop_grace_period: 45s
    deploy:
      replicas: ${ERP_WEB_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 120s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 120s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 8
        window: 240s
      resources:
        reservations:
          cpus: "0.10"
          memory: 256M
        limits:
          cpus: "2.00"
          memory: 2G

  embedding-worker:
    image: ${ERP_EMBEDDING_WORKER_IMAGE:?ERP_EMBEDDING_WORKER_IMAGE must be an immutable digest reference}
    environment:
      ERP_EMBEDDING_BATCH_SIZE: "128"
      ERP_EMBEDDING_TIMEOUT_MS: "120000"
      ERP_EMBEDDING_WORKER_LIMIT: "500"
      ERP_EMBEDDING_WORKER_POLL_MS: "1000"
      ERP_EMBEDDING_WORKER_TOKEN_FILE: /run/secrets/embedding-worker-token
      ERP_EMBEDDING_WORKER_URL: http://web:3000/api/internal/product-embeddings/drain
    secrets:
      - source: embedding_worker_token
        target: embedding-worker-token
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - default
    stop_grace_period: 45s
    deploy:
      replicas: ${ERP_EMBEDDING_WORKER_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 120s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 120s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 8
        window: 240s
      resources:
        reservations:
          cpus: "0.05"
          memory: 64M
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  app_net:
    external: true
    name: starsnap-main_app-net
  database:
    driver: overlay
    attachable: true

volumes:
  erp_postgres_data:
    external: true
    name: ${ERP_POSTGRES_VOLUME_NAME:-starsnap-erp-postgres-data-v1}
  erp_ollama_models:
    external: true
    name: ${ERP_OLLAMA_VOLUME_NAME:-starsnap-erp-ollama-models-v1}

configs:
  erp_postgres_init:
    external: true
    name: ${ERP_POSTGRES_INIT_CONFIG_NAME:-starsnap-erp-postgres-init-v1}

secrets:
  erp_db_password:
    external: true
    name: ${ERP_DB_PASSWORD_SECRET_NAME:?ERP_DB_PASSWORD_SECRET_NAME is required}
  auth_code_secret:
    external: true
    name: ${ERP_AUTH_CODE_SECRET_NAME:?ERP_AUTH_CODE_SECRET_NAME is required}
  smtp_mailer_token:
    external: true
    name: ${ERP_SMTP_MAILER_TOKEN_SECRET_NAME:?ERP_SMTP_MAILER_TOKEN_SECRET_NAME is required}
  smtp_username:
    external: true
    name: ${ERP_SMTP_USERNAME_SECRET_NAME:?ERP_SMTP_USERNAME_SECRET_NAME is required}
  smtp_password:
    external: true
    name: ${ERP_SMTP_PASSWORD_SECRET_NAME:?ERP_SMTP_PASSWORD_SECRET_NAME is required}
  embedding_worker_token:
    external: true
    name: ${ERP_EMBEDDING_WORKER_TOKEN_SECRET_NAME:?ERP_EMBEDDING_WORKER_TOKEN_SECRET_NAME is required}
  hub_ingest_secret:
    external: true
    name: ${HUB_INGEST_SECRET_NAME:?HUB_INGEST_SECRET_NAME is required}
  eat_api_service_key:
    external: true
    name: ${ERP_EAT_API_SECRET_NAME:?ERP_EAT_API_SECRET_NAME is required}
