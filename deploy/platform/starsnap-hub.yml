services:
  postgres:
    image: docker.io/library/postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
    environment:
      POSTGRES_DB: starsnap_hub
      POSTGRES_PASSWORD_FILE: /run/secrets/hub-db-password
      POSTGRES_USER: starsnap
    secrets:
      - source: hub_db_password
        target: hub-db-password
        uid: "999"
        gid: "999"
        mode: 0400
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U starsnap -d starsnap_hub
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    stop_grace_period: 60s
    deploy:
      replicas: ${HUB_POSTGRES_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 90s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 300s
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "1.00"
          memory: 1G

  server:
    image: ${HUB_SERVER_IMAGE:?HUB_SERVER_IMAGE must be an immutable digest reference}
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        export SPRING_DATASOURCE_PASSWORD="$$(< /run/secrets/hub-db-password)"
        export HUB_SERVER_LOG_SECRET="$$(< /run/secrets/hub-ingest-secret)"
        export CLOUDFLARE_ACCESS_TEAM_DOMAIN="$$(< /run/secrets/cloudflare-access-team-domain)"
        export CLOUDFLARE_ACCESS_AUDIENCE="$$(< /run/secrets/cloudflare-access-audience)"
        exec java -jar /app/starsnap-log.jar
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/starsnap_hub
      SPRING_DATASOURCE_USERNAME: starsnap
    secrets:
      - source: hub_db_password
        target: hub-db-password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: hub_ingest_secret
        target: hub-ingest-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: cloudflare_access_team_domain
        target: cloudflare-access-team-domain
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: cloudflare_access_audience
        target: cloudflare-access-audience
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - app_net
      - database
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: host
    healthcheck:
      test:
        - CMD-SHELL
        - bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8081'
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 8
    stop_grace_period: 30s
    deploy:
      replicas: ${HUB_SERVER_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 90s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 8
        window: 180s
      resources:
        reservations:
          cpus: "0.10"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 1G

  web:
    image: ${HUB_WEB_IMAGE:?HUB_WEB_IMAGE must be an immutable digest reference}
    networks:
      - app_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    stop_grace_period: 20s
    deploy:
      replicas: ${HUB_WEB_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  app_net:
    external: true
    name: starsnap-main_app-net
  database:
    driver: overlay
    attachable: true

volumes:
  hub_postgres_data:
    external: true
    name: ${HUB_POSTGRES_VOLUME_NAME:-starsnap-hub-postgres-data-v1}

secrets:
  hub_db_password:
    external: true
    name: ${HUB_DB_PASSWORD_SECRET_NAME:?HUB_DB_PASSWORD_SECRET_NAME is required}
  hub_ingest_secret:
    external: true
    name: ${HUB_INGEST_SECRET_NAME:?HUB_INGEST_SECRET_NAME is required}
  cloudflare_access_team_domain:
    external: true
    name: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN_SECRET_NAME:?CLOUDFLARE_ACCESS_TEAM_DOMAIN_SECRET_NAME is required}
  cloudflare_access_audience:
    external: true
    name: ${CLOUDFLARE_ACCESS_AUDIENCE_SECRET_NAME:?CLOUDFLARE_ACCESS_AUDIENCE_SECRET_NAME is required}
