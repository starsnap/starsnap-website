services:
  postgres:
    image: docker.io/library/postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
    environment:
      POSTGRES_DB: starsnap_hub
      POSTGRES_PASSWORD_FILE: /run/secrets/hub-db-password
      POSTGRES_USER: starsnap
    secrets:
      - source: hub_db_password
        target: hub-db-password
        uid: "999"
        gid: "999"
        mode: 0400
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U starsnap -d starsnap_hub
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    stop_grace_period: 60s
    deploy:
      replicas: ${HUB_POSTGRES_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.starsnap.actions-runner == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 90s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 300s
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "1.00"
          memory: 1G

networks:
  database:
    driver: overlay
    attachable: true

volumes:
  hub_postgres_data:
    external: true
    name: ${HUB_POSTGRES_VOLUME_NAME:-starsnap-hub-postgres-data-v1}

secrets:
  hub_db_password:
    external: true
    name: ${HUB_DB_PASSWORD_SECRET_NAME:?HUB_DB_PASSWORD_SECRET_NAME is required}
