<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>말씀 암송</title>
  <link rel="stylesheet" href="/style.css?v=13">
  <script type="module" src="/app.mjs?v=14"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell masthead">
      <span class="brand"><span class="brand-mark" aria-hidden="true">✓</span> 말씀 암송</span>
    </div>
  </header>

  <main class="shell">
    <div class="intro">
      <div>
        <h1>암송 체크</h1>
      </div>
      <button type="button" class="button secondary" data-reset-scope="all">전체 기록 초기화</button>
    </div>

    <dl class="stats" aria-label="암송 현황">
      <div><dt>전체 문제</dt><dd id="total">24</dd></div>
      <div><dt>암송 완료</dt><dd id="passed">0</dd></div>
      <div><dt>남은 문제</dt><dd id="pending">24</dd></div>
    </dl>

    <p id="storage-error" class="notice" role="alert" hidden></p>

    <div class="workspace">
      <section class="card practice" aria-labelledby="practice-title">
        <div class="card-head"><h2 id="practice-title">암송 연습</h2></div>
        <div class="exercise">
          <div class="exercise-head">
            <h3 id="question" tabindex="-1"></h3>
            <p id="attempts" class="muted"></p>
          </div>
          <div class="major-topic">
            <form id="major-topic-form" hidden>
              <label for="major-topic">대주제</label>
              <div class="major-topic-input">
                <input id="major-topic" type="text" maxlength="80" required spellcheck="false" autocomplete="off" autocorrect="off" aria-describedby="major-topic-help">
                <button type="submit" class="button secondary">대주제 채점</button>
              </div>
              <p class="muted hint" id="major-topic-help">A와 B에서 각각 한 번만 맞히면 됩니다.</p>
            </form>
            <p class="muted hint" id="major-topic-status" role="status"></p>
          </div>
          <form id="practice-form">
            <div class="answer-details">
              <div>
                <label for="topic-answer">소주제</label>
                <input id="topic-answer" type="text" maxlength="80" required spellcheck="false" autocomplete="off" autocorrect="off">
              </div>
              <div class="reference-fields" role="group" aria-label="장절">
                <div class="book-field">
                  <label for="book-answer">책 이름</label>
                  <input id="book-answer" type="text" maxlength="32" required spellcheck="false" autocomplete="off" autocorrect="off">
                </div>
                <div>
                  <label for="chapter-answer">장</label>
                  <input id="chapter-answer" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="3" required autocomplete="off">
                </div>
                <div>
                  <label for="verse-start-answer">절</label>
                  <input id="verse-start-answer" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="3" required autocomplete="off">
                </div>
                <div>
                  <label for="verse-end-answer">끝 절</label>
                  <input id="verse-end-answer" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="3" placeholder="선택" autocomplete="off">
                </div>
              </div>
            </div>
            <label for="answer">암송 내용</label>
            <textarea id="answer" rows="5" maxlength="2000" required aria-describedby="answer-hint" placeholder="기억나는 대로 입력하세요." spellcheck="false" autocomplete="off" autocorrect="off"></textarea>
            <p class="muted hint" id="answer-hint">소주제와 본문은 띄어쓰기와 문장부호를 채점에서 제외합니다.</p>
            <div class="exercise-actions">
              <button type="submit" id="submit" class="button primary">채점하기</button>
              <button type="button" id="retry" class="button secondary" hidden>다시 입력</button>
            </div>
          </form>
          <div id="result" class="result" role="status" aria-live="polite"></div>
        </div>
      </section>
      <section id="passages" class="card library" aria-labelledby="library-title">
        <div class="card-head"><h2 id="library-title">문제 목록</h2></div>
        <section class="passage-group" aria-labelledby="series-a-title">
          <div class="passage-group-heading">
            <h3 id="series-a-title">A</h3>
            <button type="button" class="button secondary" data-reset-scope="A">A 기록 초기화</button>
          </div>
          <ol id="passages-A" class="passages" role="list"></ol>
        </section>
        <section class="passage-group" aria-labelledby="series-b-title">
          <div class="passage-group-heading">
            <h3 id="series-b-title">B</h3>
            <button type="button" class="button secondary" data-reset-scope="B">B 기록 초기화</button>
          </div>
          <ol id="passages-B" class="passages" role="list"></ol>
        </section>
      </section>
    </div>
  </main>
  <dialog class="reset-dialog" id="reset-progress-dialog" aria-labelledby="reset-progress-title" aria-describedby="reset-progress-description">
    <form method="dialog">
      <h2 id="reset-progress-title">암송 기록을 초기화할까요?</h2>
      <p class="muted hint" id="reset-progress-description">이 브라우저의 대주제 확인, 완료한 구절, 연습 횟수를 지웁니다.</p>
      <div class="exercise-actions">
        <button type="submit" value="cancel" class="button secondary" autofocus>취소</button>
        <button type="submit" value="reset" class="button primary">초기화</button>
      </div>
    </form>
  </dialog>
</body>
</html>
